name: Evidence catalog consistency

on:
  push:
    paths:
      - "evidence/**"
      - "scripts/check_evidence_catalog.py"
      - ".github/workflows/evidence-catalog-consistency.yml"
  pull_request:
    paths:
      - "evidence/**"
      - "scripts/check_evidence_catalog.py"
      - ".github/workflows/evidence-catalog-consistency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-catalog:
    # Pure static/Python validation: no NAS, Quanty, private packages or local
    # hardware required. Keep this off scarce XMD self-hosted science runners.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify executed evidence catalog
        run: python3 scripts/check_evidence_catalog.py
