name: Evidence catalog consistency

on:
  push:
    paths:
      - "evidence/**"
      - "scripts/check_evidence_catalog.py"
      - ".github/workflows/evidence-catalog-consistency.yml"
  pull_request:
    paths:
      - "evidence/**"
      - "scripts/check_evidence_catalog.py"
      - ".github/workflows/evidence-catalog-consistency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-catalog:
    runs-on:
      - self-hosted
      - linux
      - x64
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify executed evidence catalog
        run: python3 scripts/check_evidence_catalog.py
