<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>XMDWorkbench Quanty roadmap evolution</title>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#f6f8fa;color:#24292f}header{padding:18px 24px;background:#0d1117;color:#fff}header h1{margin:.1rem 0 .35rem}main{padding:20px;max-width:1700px;margin:auto}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}button,select,input{font:inherit}.frame{background:#fff;border:1px solid #d0d7de;border-radius:10px;padding:18px;min-height:620px;overflow:auto;box-shadow:0 1px 2px #0001;position:relative}.meta{margin:8px 0 14px;color:#57606a;line-height:1.5}.timeline{flex:1;min-width:240px}.badge{padding:4px 8px;background:#ddf4ff;border-radius:999px;color:#0969da}button{padding:7px 12px;border:1px solid #8c959f;border-radius:6px;background:#fff;color:#24292f;cursor:pointer}button:hover{background:#f3f4f6}.change{margin-top:6px}.legend{font-size:.9rem;margin-top:10px;color:#57606a}.diagram-wrap{transform-origin:top left;width:max-content;min-width:100%;transition:transform .15s ease}.diagram-wrap svg{display:block;max-width:none;height:auto}.zoom-controls{position:sticky;left:calc(100% - 175px);top:8px;z-index:5;display:flex;gap:6px;width:max-content;margin-left:auto;margin-bottom:8px;background:#ffffffdd;border:1px solid #d0d7de;border-radius:8px;padding:6px;backdrop-filter:blur(4px)}.error{padding:16px;border:1px solid #cf222e;background:#ffebe9;color:#82071e;border-radius:8px}@media(prefers-color-scheme:dark){body{background:#0d1117;color:#c9d1d9}.frame{background:#161b22;border-color:#30363d}.meta,.legend{color:#8b949e}button{background:#21262d;color:#c9d1d9;border-color:#8b949e}button:hover{background:#30363d}.badge{background:#0c2d6b;color:#79c0ff}.zoom-controls{background:#161b22dd;border-color:#30363d}}
</style>
</head>
<body>
<header><h1>Quanty functional roadmap evolution</h1><div>Sanitized public XMDWorkbench roadmap snapshots</div></header>
<main>
<div class="controls">
<button id="first" title="First frame">⏮</button><button id="prev">◀ Previous</button><button id="play">▶ Play</button><button id="next">Next ▶</button><button id="last" title="Latest frame">⏭</button>
<label>Speed <select id="speed"><option value="5000">5s</option><option value="3000" selected>3s</option><option value="1800">1.8s</option><option value="900">0.9s</option></select></label>
<input class="timeline" id="timeline" type="range" min="0" max="1" value="0" step="1" aria-label="Roadmap timeline"><span class="badge" id="counter"></span>
</div>
<div class="meta"><strong id="title"></strong> · <span id="date"></span><div class="change" id="note"></div></div>
<div class="frame">
  <div class="zoom-controls"><button id="zoom-out" title="Zoom out">−</button><button id="zoom-reset" title="Reset zoom">100%</button><button id="zoom-in" title="Zoom in">+</button></div>
  <div class="diagram-wrap" id="diagram-wrap"><div id="diagram"></div></div>
</div>
<div class="legend">Historical frames are presentation snapshots only. Scientific truth remains governed by reviewed private evidence and the canonical roadmap source.</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'default',flowchart:{htmlLabels:true,curve:'basis',nodeSpacing:34,rankSpacing:48}});
let frames=[],i=0,timer=null,zoom=1;const $=id=>document.getElementById(id);
function applyZoom(){zoom=Math.max(.35,Math.min(2.5,zoom));$('diagram-wrap').style.transform=`scale(${zoom})`;$('zoom-reset').textContent=Math.round(zoom*100)+'%'}
function resetZoom(){zoom=1;applyZoom()}
async function loadFrames(){const idx=await fetch('history.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('history.json '+r.status);return r.json()});frames=await Promise.all(idx.frames.map(async f=>({...f,src:await fetch(f.file,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f.file+' '+r.status);return r.text()})})));if(!frames.length)throw new Error('No roadmap history frames');$('timeline').max=frames.length-1;i=frames.length-1;await render()}
async function render(){const f=frames[i];$('title').textContent=f.title;$('date').textContent=f.date;$('note').textContent=f.note;$('counter').textContent=`${i+1} / ${frames.length}`;$('timeline').value=i;try{const r=await mermaid.render('roadmap-'+i+'-'+Date.now(),f.src);$('diagram').innerHTML=r.svg;resetZoom()}catch(e){$('diagram').innerHTML='<div class="error">Mermaid render failed: '+String(e).replace(/[<>&]/g,'')+'</div>'}}
function stop(){if(timer){clearInterval(timer);timer=null;$('play').textContent='▶ Play'}}function setFrame(n){i=Math.max(0,Math.min(frames.length-1,n));render()}function step(d){let n=i+d;if(n>=frames.length)n=0;if(n<0)n=frames.length-1;setFrame(n)}
$('first').onclick=()=>{stop();setFrame(0)};$('last').onclick=()=>{stop();setFrame(frames.length-1)};$('prev').onclick=()=>{stop();step(-1)};$('next').onclick=()=>{stop();step(1)};$('timeline').oninput=e=>{stop();setFrame(+e.target.value)};$('play').onclick=()=>{if(timer){stop();return}$('play').textContent='⏸ Pause';timer=setInterval(()=>step(1),+$('speed').value)};$('speed').onchange=()=>{if(timer){stop();$('play').click()}};
$('zoom-in').onclick=()=>{zoom+=.15;applyZoom()};$('zoom-out').onclick=()=>{zoom-=.15;applyZoom()};$('zoom-reset').onclick=resetZoom;
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){stop();step(-1)}else if(e.key==='ArrowRight'){stop();step(1)}else if(e.key===' '){e.preventDefault();$('play').click()}else if(e.key==='+'){zoom+=.15;applyZoom()}else if(e.key==='-'){zoom-=.15;applyZoom()}});
loadFrames().catch(e=>{$('diagram').innerHTML='<div class="error">Unable to load roadmap history: '+String(e).replace(/[<>&]/g,'')+'</div>'});
</script>
</body></html>
